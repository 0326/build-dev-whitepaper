name: Deploy whitepaper to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: whitepaper-pages
  cancel-in-progress: false

env:
  DOCUSAURUS_DIR: website/whitepaper
  DEPLOY_TARGET: github-pages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ env.DOCUSAURUS_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.DOCUSAURUS_DIR }}
        run: npm ci

      - name: Build Docusaurus site
        working-directory: ${{ env.DOCUSAURUS_DIR }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DOCUSAURUS_DIR }}/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
