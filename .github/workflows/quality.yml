name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compile scripts and tests
        run: python -m py_compile scripts/*.py tests/*.py

      - name: Parse JSON schemas
        run: for file in schemas/*.json; do python -m json.tool "$file" >/dev/null; done

      - name: Validate evaluation catalog
        run: python scripts/validate_evals.py

      - name: Validate canonical manifest
        run: python scripts/validate_manifest.py manifests/example.whitepaper.json --root .

      - name: Audit canonical snapshot
        run: python scripts/audit_snapshot.py manifests/example.whitepaper.json --root . --version v1.0.0

      - name: Validate Docusaurus integration assets
        run: |
          node --check assets/docusaurus/scripts/project-manifest.mjs
          node --check assets/docusaurus/docusaurus.config.js
          node --check assets/docusaurus/sidebars.js
          python -m json.tool assets/docusaurus/vercel.json >/dev/null
          mkdir -p .tmp/docusaurus
          node assets/docusaurus/scripts/project-manifest.mjs \
            --manifest manifests/example.whitepaper.json \
            --root . \
            --site-dir .tmp/docusaurus \
            --out .tmp/docusaurus/whitepaper.generated.json
          python -m json.tool .tmp/docusaurus/whitepaper.generated.json >/dev/null

      - name: Run evaluation scorecard
        run: python scripts/run_evals.py evals/fixtures/example-synthetic-run.json --cases evals/evals.json

      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_*.py"

